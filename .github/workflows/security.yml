name: Public Source Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject tracked credentials and private keys
        run: python3 scripts/security_audit.py
      - name: Check project integrity
        run: |
          python3 scripts/verify_pegasvpn.py
          python3 scripts/verify_pegasvpn_platform.py
